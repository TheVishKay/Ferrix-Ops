name: ferrixOps checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bench:unit
      - run: npm run lint
      - run: npm run build

  task-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - name: Test task permissions, atomicity, and concurrency
        run: PG_BIN="$(pg_config --bindir)" python3 scripts/test_task_database.py
